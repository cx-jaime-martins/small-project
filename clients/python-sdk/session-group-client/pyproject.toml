[project]
name = "mcp-session-group-client"
version = "0.1.0"
description = "Demo client for the official MCP SDK's ClientSessionGroup (multi-server) manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Model Context Protocol a Series of LF Projects, LLC." }]
keywords = ["mcp", "session-group", "client"]
license = { text = "MIT" }
dependencies = ["mcp"]

[project.scripts]
mcp-session-group-client = "mcp_session_group_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_session_group_client"]

[project]
name = "mcp-streamable-http-client"
version = "0.1.0"
description = "Demo client for the official MCP SDK's Streamable HTTP transport"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Model Context Protocol a Series of LF Projects, LLC." }]
keywords = ["mcp", "streamable-http", "client"]
license = { text = "MIT" }
dependencies = ["mcp"]

[project.scripts]
mcp-streamable-http-client = "mcp_streamable_http_client.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_streamable_http_client"]
